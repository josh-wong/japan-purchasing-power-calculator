    runs-on: ubuntu-slim # Use ubuntu-slim for cost savings. Change only if this project needs macos-* (e.g. SwiftLint) or windows-*. For most linters, ubuntu-slim + explicit tool setup is faster and cheaper than ubuntu-latest.

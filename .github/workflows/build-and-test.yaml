name: Build and test

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Run mockup syntax
        run: python3 scripts/check_repository.py mockup
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Confirm builds without a measurement ID contain no analytics code
        run: |
          if find dist -name 'consent-banner*' | grep -q .; then
            echo "::error::The build includes the consent banner chunk."
            exit 1
          fi
          if grep -rlE 'googletagmanager|gtag|ga-disable|analytics-consent|jppc' dist/assets; then
            echo "::error::The build's scripts include analytics code."
            exit 1
          fi
      - run: npm run build -- --base=/japan-purchasing-power-calculator/
